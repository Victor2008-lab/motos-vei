<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Personal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #555555;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 10px;
        }
        .card h2 {
            margin: 10px 0;
            color: #333;
        }
        .card p {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="foto de isaak.jpg" alt="Foto de perfil">
        <h2>Isaak</h2>
        <p>Estudiante del Cbtis 52 especializado en Programacion, nacio en el 14/7/2008 un apacionado por los videojuegos desde chico y de ahi surgio todo su interes por la tecnologia, en especial la programacion que sentia que podia crear todo y eso le daba felicidad.</p>
    </div>
</body>
</html>
